name: stale-prs
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode'
        required: false
        default: 'false'
permissions:
  pull-requests: write
  issues: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: 'Dry run - would mark stale'
        if: env.DRY_RUN == 'true'
        run: |
          echo "[dry-run] Would run actions/stale@v9 with 14 day threshold"
      - name: Mark stale PRs
        if: env.DRY_RUN != 'true'
        uses: actions/stale@v9
        with:
          days-before-stale: 14
          days-before-close: -1
          stale-pr-message: 'This pull request has been inactive for 14 days and is now marked as stale.'
          stale-pr-label: 'stale'